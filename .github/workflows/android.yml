name: Build app Android

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Costruisci APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bash android-app/build.sh
      - name: Pubblica APK (release "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android-app/out/GYMER.apk \
            --title "GYMER (build ${{ github.run_number }})" \
            --notes "APK di GYMER, build ${{ github.run_number }}."
      - uses: actions/upload-artifact@v4
        with:
          name: GYMER-apk
          path: android-app/out/GYMER.apk
