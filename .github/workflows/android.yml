name: Build app Android

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

# una sola build alla volta: le piu' vecchie vengono annullate (evita conflitti sulla release "latest")
concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accetta licenze Android SDK (SDK gia presente sul runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Costruisci APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bash android-app/build.sh
      - name: Pubblica APK (release "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="GYMER (build ${{ github.run_number }})"
          NOTES="APK di GYMER, build ${{ github.run_number }}."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest android-app/out/GYMER.apk --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create latest android-app/out/GYMER.apk --title "$TITLE" --notes "$NOTES"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GYMER-apk
          path: android-app/out/GYMER.apk
